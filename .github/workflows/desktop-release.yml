name: Build Desktop Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish (leave empty for build artifacts only)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  WAILS_VERSION: "v2.10.1"
  RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm.cmd ci

      - name: Test frontend
        working-directory: frontend
        run: npm.cmd test

      - name: Build frontend
        working-directory: frontend
        run: npm.cmd run build

      - name: Test Go backend
        run: go test ./...

  build-windows:
    name: Windows amd64
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build Windows application
        run: wails build -platform windows/amd64 -clean -trimpath

      - name: Prepare Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ env.RELEASE_VERSION }}'
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq 'main') {
            $version = 'build-${{ github.run_number }}'
          }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build/bin/Doperationtool.exe "release/Doperationtool-$version-windows-amd64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doperationtool-windows-amd64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS universal
    needs: verify
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build macOS universal application
        run: wails build -platform darwin/universal -clean -trimpath

      - name: Prepare macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          version='${{ env.RELEASE_VERSION }}'
          if [[ -z "$version" || "$version" == "main" ]]; then
            version="build-${{ github.run_number }}"
          fi
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/Doperationtool.app \
            "release/Doperationtool-${version}-macos-universal.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doperationtool-macos-universal
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Doperationtool-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --title "Doperationtool $RELEASE_TAG" \
              --generate-notes
          fi
